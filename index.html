<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اختبار ضريبة الدخل</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#d0d0d0;font-family:Arial,sans-serif;padding:15px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.container{background:white;border-radius:20px;padding:25px;max-width:750px;width:100%;border:1px solid #ccc;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
.title{font-size:1.8rem;color:#0a2a4a;text-align:center;font-weight:800;}
.sub{font-size:1.1rem;color:#0a2a4a;text-align:center;margin:5px 0;}
.preptext{font-size:0.95rem;color:#c62828;text-align:center;margin:8px 0;font-weight:500;}
.prep{font-size:1rem;color:#0a2a4a;text-align:center;border-top:1px solid #ccc;padding-top:12px;margin:12px 0;}
.count{font-size:1.3rem;font-weight:700;color:#0a2a4a;text-align:center;margin:12px 0;}
.disc{background:#fff8e1;padding:12px;border-radius:12px;font-size:0.8rem;color:#555;text-align:center;margin:12px 0;border-right:4px solid #0a2a4a;}
.startbtn{background:#0a2a4a;color:white;border:none;padding:14px;border-radius:12px;font-size:1.1rem;font-weight:bold;cursor:pointer;display:block;margin:15px auto;width:100%;max-width:280px;}
.startbtn:active{transform:scale(0.96);}
.progress{display:flex;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap;gap:8px;}
.qcounter,.qscore{background:#0a2a4a;color:white;padding:5px 14px;border-radius:12px;font-weight:bold;font-size:0.85rem;}
.qscore{background:#c62828;}
.qtext{font-size:1.2rem;font-weight:700;margin:15px 0 20px;color:#0a2a4a;line-height:1.5;text-align:right;}
.options{list-style:none;padding:0;margin:0 0 15px 0;}
.opt{background:white;border:1px solid #ccc;border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer;text-align:right;font-size:0.95rem;color:#333;display:flex;align-items:center;gap:12px;}
.opt:active{background:#eef2f7;}
.opt .prefix{background:#cbd5e1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold;flex-shrink:0;}
.opt.correct{background:#bbf7d0;border-color:#15803d;color:#14532d;}
.opt.correct .prefix{background:#15803d;color:white;}
.opt.wrong{background:#ffe4e2;border-color:#b91c1c;color:#7f1a1a;text-decoration:line-through;}
.opt.wrong .prefix{background:#b91c1c;color:white;}
.opt.disabled{opacity:0.8;cursor:default;}
.feedback{border-radius:12px;padding:12px;margin:10px 0;text-align:center;font-size:0.9rem;display:none;}
.fbgood{background:#dcfce7;color:#166534;display:block;border-right:4px solid #22c55e;}
.fbbad{background:#fee2e2;color:#991b1b;display:block;border-right:4px solid #ef4444;}
.actions{display:flex;gap:10px;margin-top:15px;}
.nav{background:#e0e0e0;border:1px solid #ccc;padding:10px;border-radius:12px;font-size:0.95rem;font-weight:bold;color:#333;cursor:pointer;flex:1;text-align:center;}
.nav:active{transform:scale(0.96);}
.next{background:#0a2a4a;color:white;border:none;}
.submit{background:#c62828;color:white;border:none;}
.result-title{font-size:1.8rem;color:#0a2a4a;text-align:center;font-weight:800;}
.final-score{font-size:2.5rem;font-weight:800;color:#0a2a4a;text-align:center;margin:15px 0;}
.final-msg{font-size:1rem;text-align:center;color:#333;margin-bottom:15px;}
.btn-restart{background:#0a2a4a;color:white;border:none;padding:12px;border-radius:12px;font-size:1rem;cursor:pointer;display:block;margin:10px auto;width:100%;max-width:250px;}
.btn-restart:active{transform:scale(0.96);}
.footer-disc{font-size:0.7rem;color:#888;margin-top:15px;padding:10px;border-top:1px solid #ccc;text-align:center;}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
var QUESTIONS = [
{text:"يخضع المكلفون الآتي بيانهم لفئة مكلفي الأرباح الحقيقية:",options:["الشركات المساهمة والشركات المحدودة المسؤولية.","المحامين.","المهندسين"],correct:0},
{text:"يخضع المحاسب القانوني لضريبة:",options:["دخل المقطوع.","الرواتب والأجور.","الأرباح الحقيقية."],correct:2},
{text:"يتوجب على مكلفي الأرباح الحقيقية أن يقدموا بيانات أرباحهم السنوية معتمدة من قبل:",options:["محاسب قانوني مجاز أصولاً من غير العاملين في وزارة المالية.","محاسب قانوني مجاز أصولاً من غير العاملين في الجهاز المركزي للرقابة المالية.","محاسب قانوني مجاز أصولاً من غير العاملين في الدولة."],correct:2},
{text:"يجوز تدوير العجز (الخسارة المقبولة) في أحد السنين للمدد الآتية:",options:["لغاية السنة الثالثة التي تلي سنة وقوع العجز.","لغاية السنة الرابعة التي تلي سنة وقوع العجز.","لغاية السنة الخامسة التي تلي سنة وقوع العجز."],correct:2},
{text:"تعتبر النفقة التالية من النفقات المقبول تنزيلها من الربح الصافي الخاضع للضريبة:",options:["النفقات الرأسمالية.","بدلات إيجار المحلات المعدة لممارسة العمل.","رواتب وأجور الشركاء"],correct:1},
{text:"التبرعات تعد نفقة مقبولة ضريبياً إذا كانت بنسبة من الأرباح الصافية لا تتجاوز:",options:["3 %.","4 %.","5 %"],correct:1},
{text:"تخضع الشركات المساهمة والشركات ذات المسؤولية المحدودة التي مركزها الرئيسي أو فرعها في الجمهورية العربية السورية في القطاعين الخاص والعام للمعدل الضريبي الآتي:",options:["18%.","20%.","22%."],correct:1},
{text:"تخضع أرباح الشركة السورية للغاز لمعدل ضريبي وحيد قدره:",options:["22%.","28%.","35%."],correct:2},
{text:"يترتب على الشركات المساهمة وذات المسؤولية المحدودة وكبار المكلفين أن يقدموا بياناتهم الضريبية السنوية بنتائج أعمالها خلال السنة السابقة لغاية تاريخ:",options:["30 نيسان.","31 أيار.","30 حزيران"],correct:1},
{text:"يجوز لوزير المالية في حالات استثنائية أن يمنح مهلة إضافية لتقديم البيان الضريبي لا تتجاوز:",options:["خمسون يوما.","ستون يوماً.","تسعون يوماً"],correct:1},
{text:"يتوجب على المكلفين أن يدفعوا إلى الخزينة الضريبة المترتبة على الأرباح المصرح بها في البيان الضريبي خلال:",options:["عشرة أيام تلي انتهاء مدة تقديم البيان.","خمسة عشر يوماً تلي انتهاء مدة تقديم البيان.","30 يوم تلي انتهاء مدة تقديم البيان"],correct:2},
{text:"يترتب على المكلفين الذين يقومون بالتنازل أو بتصفية الكل أو الجزء من مؤسساتهم تقديم بيان إلى الدوائر المالية خلال:",options:["10 أيام بدءاً من تاريخ صدور قرار التصفية.","15 يوم بدءاً من تاريخ صدور قرار التصفية.","30 يوم بدءاً من تاريخ صدور قرار التصفية"],correct:2},
{text:"تخفض المعدلات الضريبية المنصوص عليها في المادة /16/ من القانون رقم /24/ لعام 2003 وتعديلاته والمعدل بالمرسوم /30/ لعام 2023 للمنشآت الصناعية التي تستخدم /75/ عاملاً:",options:["درجة واحدة.","درجتان.","ثلاث درجات."],correct:1},
{text:"تخفض المعدلات الضريبية المنصوص عليها في المادة /16/ من القانون رقم /24/ لعام 2003 وتعديلاته والمعدل بالمرسوم /30/ لعام 2023 للمنشآت الصناعية المقامة ضمن المدن الصناعية:",options:["درجة واحدة","درجتان.","ثلاث درجات."],correct:0},
{text:"ينزل من الربح الصافي للشخص الطبيعي المكلف المبلغ الآتي كحد أدنى معفى من ضريبة الدخل:",options:["3,000,000 ل.س ثلاثة ملايين ليرة سورية.","4,000,000 ل.س أربعة ملايين ليرة سورية.","5,000,000 ل.س خمسة ملايين ليرة سورية."],correct:0},
{text:"من شروط الاستفادة من الحد الأدنى المعفى على ضريبة الدخل للشخص الطبيعي:",options:["يستفيد مرة واحدة فقط الأشخاص الطبيعيين الذين منشآتهم مسجلة أصولاً.","ان يلتزم المستفيد بمسك قيود محاسبية منتظمة تظهر أرباحه الحقيقية.","أن يلتزم بأحكام القانون 24 لعام 2003 المادة 13 (بشأن تقديم البيان) والمادة 14 (مرفقات البيان).","جميع ما سبق."],correct:3},
{text:"ينزل حد أدنى معفى من الأرباح السنوية العائدة لمكلفي المهن العلمية مقداره:",options:["3,000,000 ل.س ثلاثة ملايين ليرة سورية.","4,000,000 ل.س أربعة ملايين ليرة سورية.","5,000,000 ل.س خمسة ملايين ليرة سورية."],correct:0},
{text:"يتوجب على المكلفين الذين يقومون بتصفية الكل أو الجزء تسديد الضريبة المترتبة عليهم نتيجة التصفية خلال المهلة التالية:",options:["15 يوم من تاريخ انتهاء مهلة تقديم البيان.","30 يوم من تاريخ انتهاء مهلة تقديم البيان.","شهرين من تاريخ انتهاء مهلة تقديم البيان"],correct:1},
{text:"يستفيد من تنزيل الحد الأدنى المعفى من الضريبة كل من:",options:["الشريك المتضامن.","الشريك الموصي المتزوج.","الشريك الموصي الأعزب."],correct:0},
{text:"يصبح التكليف المؤقت غير المعترض عليه قطعياً بعد إقراره من:",options:["لجنة الطعن.","لجنة الإدارة المالية.","لجنة الاستئناف."],correct:1},
{text:"يتم تشكيل لجنة الطعن بقرار من وزير المالية وتتألف من:",options:["مدير المالية (أو رؤساء لجان الطعن تتم تسميتهم من قبل السيد الوزير).","ممثل عن الإدارات العامة.","خبير مهنة + مراقب دخل (مقرر) ليس له صوت.","جميع ما سبق."],correct:3},
{text:"يجوز الاعتراض على التكاليف المؤقتة الى لجنة الطعن خلال المدة التالية:",options:["ثلاثون يوماً من اليوم الذي يلي تاريخ تبليغ المكلف الاخبار المؤقت.","خمسة عشر يوماً من اليوم الذي يلي تاريخ تبليغ المكلف.","عشرة أيام من اليوم الذي يلي تاريخ تبليغ المكلف."],correct:0},
{text:"يشترط في الاعتراض الى لجنة الطعن تسديد تأمين قدره:",options:["50,000 ل.س خمسون ألف ليرة سورية خلال مهلة الاعتراض والا رد طلب الاعتراض شكلاً.","100,000 ل.س مائة ألف ليرة سورية خلال مهلة الاعتراض والا رد طلب الاعتراض شكلاً.","150,000 ل.س مائة وخمسون ألف ليرة سورية خلال مهلة الاعتراض والا رد طلب الاعتراض شكلاً."],correct:1},
{text:"لا يجوز للجنة الإدارة المالية القيام بـــ:",options:["إنقاص التكليف.","زيادة التكليف.","تثبيت التكليف."],correct:0},
{text:"لا تصح قرارات لجنة الطعن إلا:",options:["بحضور ثلثي أعضائها وتتخذ قراراتها بأكثرية أصوات الحاضرين.","بحضور أغلبية أعضائها وتتخذ قراراتها بأكثرية أصوات الحاضرين.","بحضور جميع أعضائها وتتخذ قراراتها بأكثرية أصوات الحاضرين."],correct:2},
{text:"يحق للمكلف وللدوائر المالية الاعتراض الى لجنة إعادة النظر خلال مدة أقصاها:",options:["شهر من اليوم الذي يلي تاريخ تبلغ اخبار لجنة الطعن.","30 يوم من اليوم الذي يلي تاريخ تبلغ اخبار لجنة الطعن.","60 يوم من اليوم الذي يلي تاريخ تبلغ اخبار لجنة الطعن."],correct:1},
{text:"يحق للدوائر المالية الاعتراض الى لجنة إعادة النظر خلال مدة /30/ يوم من اليوم التالي لتاريخ تبليغ اخبار لجنة الطعن في الحالات التالية:",options:["عندما يكون القرار مبنياً على وثائق غير صحيحة وغير متفق مع نصوص القانون.","عندما يعتمد التكليف على التقدير في تحديد الأرباح الصافية.","إذا كان التكليف غير متفق مع النصوص القانونية أو مع تعليمات وزارة المالية.","إذا اتخذ القرار بالأكثرية وليس بالإجماع.","جميع ماسبق."],correct:4},
{text:"إن طلب إعادة النظر بالتكليف الضريبي:",options:["يوقف التحصيل.","لا يوقف التحصيل.","يوقف تحصيل /50%/ من الضريبة المتوجبة."],correct:1},
{text:"لا يقبل طلب إعادة النظر بالتكليف الضريبي ما لم يرفق به إيصال يثبت أن المكلف سدد تأميناً قدره:",options:["5% من الضريبة.","150,000 ل.س مائة وخمسون ألف ليرة سورية.","500,000 ل.س خمسمائة ألف ليرة سورية."],correct:1},
{text:"يجب أن يؤدى تأمين طلب إعادة النظر خلال:",options:["مهلة طلب إعادة النظر.","خلال عشرة أيام من تقديم الطلب.","خلال شهر من تاريخ تقديم الطلب."],correct:0},
{text:"تشكل لجنة إعادة النظر من:",options:["معاون وزير المالية لشؤون الإيرادات رئيساً.","قاضي بدرجة مستشار استئناف يسميه وزير العدل(عضواً)، ومدير في الإدارة المركزية (عضواً).","ممثل عن القطاع العام (يعينه وزير المالية) (عضواً)، وخبير يختاره وزير المالية غير الخبير المسمى في لجان فرض الضريبة(عضوا).","يكون للجنة مقرر من ذوي الخبرة في ضريبة الدخل يسميه وزير المالية ولا يشترك بالتصويت.","جميع ما سبق."],correct:4},
{text:"لا تصح قرارات لجان إعادة النظر إلا:",options:["بحضور ثلثي أعضائها منهم الرئيس.","بحضور جميع أعضائها بما فيهم الرئيس.","بحضور أربعة من أعضائها منهم رئيس اللجنة وممثل المهنة."],correct:2},
{text:"يجوز الطعن بقرارات لجان إعادة النظر أمام القضاء المختص في إحدى الحالات التالية:",options:["في حال تضمن قرار اللجنة زيادة أو تخفيض أرباح التكليف بنسبة تزيد أو تنقص 50%.","في حال تضمن قرار اللجنة زيادة أو تخفيض أرباح التكليف بنسبة تزيد أو تنقص 25%.","مهما كانت نسبة الزيادة أو التخفيض."],correct:1},
{text:"يجوز للمكلف تقديم طلب تصحيح لقرار لجنة إعادة النظر:",options:["إذا كان القرار متخذاً بالأكثرية.","إذا كان القرار مبنياً على وثائق مزورة.","إذا كان القرار متخذاً بمخالفة رئيس اللجنة."],correct:1},
{text:"ماهي المهلة القانونية للاعتراض على التكليف المؤقت لضريبة الدخل:",options:["خلال /30/ يوم تلي تاريخ تبلغ الاخبار المؤقت.","خلال /30/ يوم من تاريخ تبلغ الاخبار المؤقت.","خلال /15/ يوم من تاريخ تبلغ الاخبار المؤقت."],correct:0},
{text:"ماهي المهلة القانونية للاعتراض على قرار لجنة التصنيف البدائية لضريبة الدخل المقطوع:",options:["خلال /30/ يوم من تاريخ تبلغ قرار لجنة التصنيف البدائية.","خلال /30/ يوم تلي تاريخ تبلغ قرار لجنة التصنيف البدائية.","خلال /15/ يوم من تاريخ تبلغ قرار لجنة التصنيف البدائية."],correct:1},
{text:"ماهي المهلة القانونية لتقديم بيان تصفية نهائية لشركة محدودة المسؤولية:",options:["خلال /30/ يوم من تاريخ التصفية.","خلال /30/ يوم تلي تاريخ التصفية.","خلال /15/ يوم من تاريخ التصفية."],correct:0},
{text:"ماهي المهلة القانونية لتسديد ضريبة غير المقيمين:",options:["خلال /15/ يوم من تاريخ تسديد الفاتورة.","خلال /30/ يوم من الشهر الذي يلي الشهر الذي سددت فيه الفاتورة.","خلال /15/ يوم من الشهر الذي يلي الشهر الذي سددت فيه الفاتورة"],correct:2},
{text:"ماهي المهلة القانونية لتقديم بيانات الرواتب والأجور عن الربع الثالث:",options:["خلال /15/ يوم من شهر تشرين الأول.","خلال /30/ يوم من شهر تشرين الأول.","خلال /15/ يوم من شهر أيلول."],correct:0},
{text:"ماهي المهلة القانونية لتسديد ضريبة الرواتب والأجور:",options:["خلال /30/ يوم تاريخ انقضاء كل ثلاثة أشهر.","خلال /10/ أيام تاريخ انقضاء كل ثلاثة أشهر.","خلال /15/ يوم تاريخ انقضاء كل ثلاثة أشهر."],correct:2},
{text:"ماهي نسبة الضريبة التي تخضع لها الشركات المساهمة التي تم الاكتتاب العام على أسهمها بنسبة تقل عن 40% وشركات القطاعين العام والمشترك لتكاليف عام 2025 وما قبل:",options:["20% يضاف لها 10% إدارة محلية و10% إعادة اعمار من قيمة الضريبة.","22% يضاف لها 10% إدارة محلية و10% إعادة اعمار من قيمة الضريبة.","20% بدون اضافات."],correct:0},
{text:"ماهي نسبة الضريبة التي تخضع لها الشركات المساهمة التي تم الاكتتاب العام على أسهمها بنسبة تتجاوز 40% وتم الاكتتاب بها لتكاليف عام 2025 وما قبل:",options:["15% يضاف لها 10% إدارة محلية و10% إعادة اعمار من قيمة الضريبة.","20% يضاف لها 10% إدارة محلية و10% إعادة اعمار من قيمة الضريبة.","25% بدون اضافات."],correct:0},

var total=QUESTIONS.length,current=0,answers=[],checked=[],started=false,done=false,app=document.getElementById('app');
for(var i=0;i<total;i++){answers[i]=null;checked[i]=false;}
function letter(i){var l=['أ','ب','ج','د','ه','و','ز','ح','ط','ي','ك','ل'];return l[i]||'';}
function countChecked(){var c=0;for(var i=0;i<checked.length;i++){if(checked[i])c++;}return c;}
function startScreen(){
var h='<div class="title">اختبار ضريبة الدخل</div><div class="sub">القانون رقم /24/ لعام 2003 وتعديلاته</div><div class="preptext">اختبار تفاعلي — الدورة التحضيرية لفحص المحاسب القانوني</div><div class="prep">إعداد المحاسب القانوني<br>ماهر وهبي</div><div class="count">📚 عدد الأسئلة: '+total+' سؤالاً</div><div class="disc">⚠️ تنبيه: هذه الأسئلة نماذج استرشادية للاستئناس فقط<br>يرجى الرجوع إلى النصوص القانونية الواردة عند الدراسة</div><button class="startbtn" onclick="started=true;showQ();">▶ ابدأ الاختبار</button>';
app.innerHTML=h;
}
function showQ(){
if(!started){startScreen();return;}
if(done){showResult();return;}
var q=QUESTIONS[current],isCh=checked[current],sel=answers[current];
var h='<div class="prep" style="border-top:none;padding-top:0;margin-top:0;">إعداد المحاسب القانوني: ماهر وهبي</div><div class="progress"><span class="qcounter">السؤال '+(current+1)+' من '+total+'</span><span class="qscore">✅ تم الإجابة: '+countChecked()+'/'+total+'</span></div><div class="qtext">'+q.text+'</div><ul class="options">';
for(var i=0;i<q.options.length;i++){
var cls='opt';
if(isCh){
if(i===q.correct)cls+=' correct';
if(sel===i && i!==q.correct)cls+=' wrong';
cls+=' disabled';
}
var pe=isCh?'pointer-events:none;':'';
h+='<li class="'+cls+'" data-idx="'+i+'" style="'+pe+'"><span class="prefix">'+letter(i)+'</span><span>'+q.options[i]+'</span></li>';
}
h+='</ul>';
if(isCh){
var fc=(sel===q.correct)?'fbgood':'fbbad';
var ft=(sel===q.correct)?'✅ إجابتك صحيحة! ✓':'❌ إجابتك خاطئة.<br> الإجابة الصحيحة هي: '+letter(q.correct);
h+='<div class="feedback '+fc+'">'+ft+'</div>';
}else{h+='<div class="feedback" style="display:none;"></div>';}
var isLast=(current===total-1);
var nextBtn=isLast?'<div class="nav submit" onclick="finish()">✍️ إنهاء</div>':'<div class="nav next" onclick="goNext()">التالي ▶</div>';
h+='<div class="actions"><div class="nav" onclick="goPrev()">◀ السابق</div>'+nextBtn+'</div>';
app.innerHTML=h;
if(!isCh){
var opts=document.querySelectorAll('.opt');
for(var j=0;j<opts.length;j++){
(function(el){
el.onclick=function(){
var idx=parseInt(el.dataset.idx);
if(!isNaN(idx) && !checked[current]){
answers[current]=idx;
checked[current]=true;
showQ();
}
};
})(opts[j]);
}
}
}
function goPrev(){if(current>0){current--;showQ();}}
function goNext(){if(current<total-1){current++;showQ();}}
function finish(){var rem=total-countChecked();if(rem>0 && !confirm('لديك '+rem+' سؤالاً لم يتم الإجابة عليه. هل تريد إنهاء الاختبار؟'))return;done=true;showResult();}
function showResult(){
var s=0;for(var i=0;i<total;i++){if(answers[i]!==null && answers[i]===QUESTIONS[i].correct)s++;}
var pct=Math.round((s/total)*100);
var msg='';if(pct>=80)msg='🎉 ممتاز! أداء رائع 🎉';else if(pct>=60)msg='👍 جيد جداً، يمكنك التحسن أكثر 👍';else if(pct>=40)msg='📚 جيد، حاول مراجعة المعلومات 📚';else msg='💪 لا تقلق، تعلم من أخطائك وحاول مجدداً 💪';
var h='<div class="result-title">🏆 نتيجة الاختبار 🏆</div><div class="prep">إعداد المحاسب القانوني: ماهر وهبي</div><div class="final-score">'+s+' / '+total+'</div><div class="final-msg">'+msg+'</div><div style="text-align:center;margin:10px 0;"><span class="qscore" style="background:#0a2a4a;padding:6px 18px;border-radius:12px;">النسبة: '+pct+'%</span></div><button class="btn-restart" onclick="location.reload()">🔄 إعادة الاختبار من البداية</button><div class="footer-disc">⚠️ تنبيه: الأسئلة أعلاه هي نماذج استرشادية للاستئناس فقط.<br>يرجى الرجوع إلى النصوص القانونية الواردة عند الدراسة.</div>';
app.innerHTML=h;
}
startScreen();
</script>
